name: Deploy to Cloudflare Workers
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      preflight:
        description: Read-only account, Pages, Worker and Supabase health checks
        type: boolean
        default: true
      bridge_stage:
        description: Reviewed Pages bridge migration stage
        type: choice
        default: none
        options: [none, preview, production]
concurrency:
  group: cloudflare-echoes-release
  cancel-in-progress: false
permissions:
  contents: read

jobs:
  deploy:
    if: github.event_name != 'workflow_dispatch' || inputs.bridge_stage == 'none'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read-only Cloudflare migration preflight
        if: github.event_name == 'workflow_dispatch' && inputs.preflight
        run: node scripts/cloudflare-preflight.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      - run: npm ci
        if: github.event_name != 'workflow_dispatch' || !inputs.preflight
      - name: Build
        if: github.event_name != 'workflow_dispatch' || !inputs.preflight
        run: npm run cf:build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      - name: Deploy to Cloudflare Workers
        if: github.event_name != 'workflow_dispatch' || !inputs.preflight
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --keep-vars

  pages-bridge:
    if: github.event_name == 'workflow_dispatch' && inputs.bridge_stage != 'none' && !inputs.preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node --test scripts/pages-bridge.test.mjs scripts/pages-bridge-release.test.mjs
      - name: Run reviewed Pages bridge stage
        run: node scripts/pages-bridge-release.mjs "$BRIDGE_STAGE"
        env:
          BRIDGE_STAGE: ${{ inputs.bridge_stage }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
