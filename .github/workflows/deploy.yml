name: Deploy to Cloudflare Workers
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      preflight:
        description: Read-only account, Pages, Worker and Supabase health checks
        type: boolean
        default: true
      release_peers:
        description: One-time reviewed QR and Humanize Pages release (2026-10-18)
        type: boolean
        default: false
jobs:
  deploy:
    if: github.event_name != 'workflow_dispatch' || !inputs.release_peers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read-only Cloudflare migration preflight
        if: github.event_name == 'workflow_dispatch' && inputs.preflight
        run: node scripts/cloudflare-preflight.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      - run: npm ci
        if: github.event_name != 'workflow_dispatch' || !inputs.preflight
      - name: Build
        if: github.event_name != 'workflow_dispatch' || !inputs.preflight
        run: npm run cf:build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      - name: Deploy to Cloudflare Workers
        if: github.event_name != 'workflow_dispatch' || !inputs.preflight
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --keep-vars

  # Temporary release job: remove after this authorized 2026-10-18 migration.
  pages-peer-release:
    if: github.event_name == 'workflow_dispatch' && inputs.release_peers
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - repository: LLL-development/lll-simple-qr
            project: lll-simple-qr
            sha: 4153321f9862e1d0861d51df6c828705b888df2a
          - repository: LLL-development/lll-humanize
            project: lll-humanize
            sha: d7ad5e1d1095686326cf277265ffca2bb87789f9
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.sha }}
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify reviewed source and stage public files
        env:
          PROJECT: ${{ matrix.project }}
          EXPECTED_SHA: ${{ matrix.sha }}
        run: |
          test "$(git -C source rev-parse HEAD)" = "$EXPECTED_SHA"
          mkdir -p "$RUNNER_TEMP/pages-peer-$PROJECT"
          if [ "$PROJECT" = "lll-simple-qr" ]; then
            (cd source && node --test tests/qr.test.cjs)
            cp source/index.html "$RUNNER_TEMP/pages-peer-$PROJECT/"
            cp -R source/vendor "$RUNNER_TEMP/pages-peer-$PROJECT/"
          else
            (cd source && npm test)
            cp source/index.html source/app.js source/detector.js source/plagiarism.js source/strings.js source/site.css source/logo.svg "$RUNNER_TEMP/pages-peer-$PROJECT/"
            mkdir -p "$RUNNER_TEMP/pages-peer-$PROJECT/functions/api"
            cp source/functions/api/humanize.js "$RUNNER_TEMP/pages-peer-$PROJECT/functions/api/"
          fi
      - name: Publish reviewed commit to existing Pages project
        working-directory: ${{ runner.temp }}/pages-peer-${{ matrix.project }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ matrix.project }}
          EXPECTED_SHA: ${{ matrix.sha }}
        run: >-
          npx --yes wrangler@4.151.1 pages deploy .
          --project-name "$PROJECT" --branch main
          --commit-hash "$EXPECTED_SHA" --commit-dirty=false
